[project]
name = "agri-dms"
version = "0.1.0"
description = "Marinduque PAO agri data management and analytics system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "django-filter>=24.3",
    "djangorestframework-simplejwt>=5.4",
    "django-axes>=7.0",
    "argon2-cffi>=23.1",
    "django-environ>=0.12",
    "django-cors-headers>=4.6",
    "psycopg[binary]>=3.2",
    "celery>=5.4,<6",
    "redis>=5.2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "rapidfuzz>=3.10",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "celery-types>=0.22",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF", "C4", "PT"]
ignore = ["RUF012"]  # DRF/Django class attributes (Meta.fields etc.) are idiomatic mutable lists

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"tests/**" = ["S101", "S105", "S106"]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["config", "common", "apps"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
files = ["config", "common", "apps"]
exclude = ["/migrations/", "/tests/"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["environ.*", "axes.*", "corsheaders.*", "django_filters.*", "openpyxl.*", "rapidfuzz.*", "factory.*", "jsonschema.*", "pandas.*"]
ignore_missing_imports = true

# Business logic is held to the strictest standard.
[[tool.mypy.overrides]]
module = ["*.services", "*.selectors", "common.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--ds=config.settings.test -ra --strict-markers --cov --cov-report=term-missing:skip-covered"
testpaths = ["tests", "common", "apps"]
python_files = ["test_*.py"]
markers = [
    "real_data: needs the real PAO workbook in data/raw/ (skipped when absent)",
]

[tool.coverage.run]
branch = true
source = ["config", "common", "apps"]
omit = ["*/migrations/*", "*/tests/*", "config/settings/*", "config/wsgi.py", "config/asgi.py", "manage.py"]
