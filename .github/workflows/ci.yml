name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-guard:
    name: No personal data or secrets tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject data files, spreadsheets, uploads and .env
        run: |
          bad=$(git ls-files \
            | grep -E '^data/|^private_files/|\.(xlsx|xls|xlsm|csv)$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked files that may contain personal data or secrets:"
            echo "$bad"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: gitleaks (full history)
        run: ./gitleaks detect --source . --redact --no-banner

  server:
    runs-on: ubuntu-latest
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache the MongoDB binary used by the in-memory test database
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -w server
      - run: npm run typecheck -w server
      - run: npm run format:check -w server
      - name: Tests, with the coverage gate
        run: npm run test:coverage -w server
      - run: npm run build -w server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -w frontend
      - run: npm run typecheck -w frontend
      - run: npm run format:check -w frontend
      - run: npm test -w frontend
      - run: npm run build -w frontend
      - name: API types match the contract (ADR-0011)
        run: |
          npm run gen:api -w frontend
          git diff --exit-code frontend/src/lib/api/schema.d.ts \
            || (echo "::error::Run npm run gen:api -w frontend and commit the result" && exit 1)
      - name: Known vulnerabilities in npm dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
